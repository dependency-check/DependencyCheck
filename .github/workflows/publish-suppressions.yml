name: Publish Suppressions

on:
  workflow_dispatch:
  pull_request_target:
    # BE CAREFUL - this event runs in the context of the default branch (`main`) workflow definition in the target
    #    repository (NOT the fork's context), so it has potentially sensitive access.
    #    It is critical that this only runs on very limited events and/or access to the repo
    # Read https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request_target
    types: [ closed ]
    branches: [ generatedSuppressions ]
    paths: [ generatedSuppressions.xml ]


permissions: {}
jobs:
  update_suppression:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    permissions:
      contents: write # to push changes in repo (jamesives/github-pages-deploy-action)

    name: Publish Suppressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generatedSuppressions
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - run: |
          npm install fs
      - name: Create Generated Suppressions XML
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const generatedSuppressions = fs.readFileSync('generatedSuppressions.xml', 'utf8');
            if (!fs.existsSync('./suppressions')){
                fs.mkdirSync('./suppressions');
            }
            fs.appendFileSync('suppressions/publishedSuppressions.xml',
            `<?xml version="1.0" encoding="UTF-8"?>
            <suppressions xmlns="https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd"
                          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                          xsi:schemaLocation="https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd
                                              https://dependency-check.github.io/DependencyCheck/dependency-suppression.1.3.xsd">
            ${generatedSuppressions}
            </suppressions>`,
            function (err) {
              if (err) throw err;
              console.log('publishedSuppressions.xml created');
            });
      - name: Publish Updated Suppressions
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: suppressions
          target-folder: suppressions

